<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daimler - Diario Fullscreen</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="datos_ayer.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #38bdf8; --gold: #fbbf24; --red: #ef4444; --green: #22c55e; }
        * { box-sizing: border-box; }
        
        html, body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            height: 100%; /* Asegura que el body ocupe todo el alto */
            width: 100%;
        }

        /* BANNER SUPERIOR - 8% del alto */
        .header-banner { 
            height: 8vh;
            background: #1e293b; 
            border-bottom: 3px solid var(--blue); 
            display: table;
            width: 100%;
            text-align: center;
        }
        .header-banner h1 { 
            display: table-cell;
            vertical-align: middle;
            font-size: 2.2rem; 
            margin: 0; 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            font-weight: 900; 
            text-shadow: 0 0 15px var(--blue); 
        }

        /* AWARDS - 12% del alto */
        .awards-table {
            display: table;
            width: 100%;
            height: 12vh;
            border-spacing: 10px;
            table-layout: fixed;
        }
        .award-card { 
            display: table-cell;
            background: var(--card); 
            border-radius: 12px; 
            text-align: center; 
            vertical-align: middle;
            border-bottom: 6px solid transparent; 
        }
        .award-label { font-size: 0.9rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; }
        .award-name { font-size: 1.8rem; font-weight: 900; margin-top: 5px; }

        /* GRID PRINCIPAL - 50% del alto */
        .main-layout {
            display: table;
            width: 100%;
            height: 50vh;
            border-spacing: 10px;
            table-layout: fixed;
        }
        .col-left { display: table-cell; vertical-align: top; width: 65%; }
        .col-right { display: table-cell; vertical-align: top; width: 35%; }

        .card { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 15px; 
            border: 1px solid #334155; 
            height: 100%;
        }

        .kpi-card-inner { 
            height: 31%; /* Divide el espacio derecho en 3 */
            margin-bottom: 2%;
            background: var(--card);
            border-radius: 15px;
            border: 1px solid #334155;
            text-align: center;
            display: table;
            width: 100%;
        }
        .kpi-content { display: table-cell; vertical-align: middle; }
        .kpi-label { font-size: 1rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; }
        .kpi-val { font-size: 3.5rem; font-weight: 900; color: var(--blue); line-height: 1; }

        /* SECCIÓN INFERIOR - 28% del alto */
        .bottom-layout {
            display: table;
            width: 100%;
            height: 28vh;
            border-spacing: 10px;
            table-layout: fixed;
        }
        .bottom-col { display: table-cell; vertical-align: top; height: 100%; }

        .split-card {
            display: inline-block;
            width: 48%;
            height: 100%;
            margin: 0 1%;
            border-radius: 15px;
            text-align: center;
            vertical-align: top;
            padding-top: 20px;
        }

        .res-item { 
            border-bottom: 1px solid #334155; 
            padding: 8px 0; 
            font-size: 1.1rem;
            clear: both;
        }
        .res-item span { float: left; }
        .res-item b { float: right; }

    </style>
</head>
<body>
    <div class="header-banner"><h1>🚀 AYER - TOTALPLAY GABSSA</h1></div>

    <div class="awards-table">
        <div class="award-card" style="border-color: var(--gold);">
            <div class="award-label">⭐ TOP EFECTIVIDAD</div>
            <div id="w-efec" class="award-name" style="color: var(--gold);">---</div>
        </div>
        <div class="award-card" style="border-color: var(--blue);">
            <div class="award-label">📞 MÁS TRABAJADOR</div>
            <div id="w-trab" class="award-name" style="color: var(--blue);">---</div>
        </div>
        <div class="award-card" style="border-color: var(--red);">
            <div class="award-label">🔥 MEJOR RACHA</div>
            <div id="w-racha" class="award-name" style="color: var(--red);">---</div>
        </div>
    </div>

    <div class="main-layout">
        <div class="col-left">
            <div class="card">
                <div class="kpi-label" style="color: var(--blue); margin-bottom: 10px;">🏆 Ranking de Reactivaciones (Ayer)</div>
                <div style="height: 90%;"><canvas id="chartCarrera"></canvas></div>
            </div>
        </div>
        <div class="col-right">
            <div class="kpi-card-inner"><div class="kpi-content"><div class="kpi-label">Gestiones Ayer</div><div id="v-gest" class="kpi-val">0</div></div></div>
            <div class="kpi-card-inner"><div class="kpi-content"><div class="kpi-label">Promesas Ayer</div><div id="v-react" class="kpi-val">0</div></div></div>
            <div class="kpi-card-inner"><div class="kpi-content"><div class="kpi-label">RPC Global</div><div id="v-rpc-main" class="kpi-val" style="color:var(--green)">0%</div></div></div>
        </div>
    </div>

    <div class="bottom-layout">
        <div class="bottom-col" style="width: 40%;">
            <div class="card">
                <div class="kpi-label">📈 Marcación por Hora</div>
                <div style="height: 85%;"><canvas id="chartHora"></canvas></div>
            </div>
        </div>
        <div class="bottom-col" style="width: 30%;">
            <div class="card" style="overflow-y: hidden;">
                <div class="kpi-label">📊 Top Contactabilidad</div>
                <div id="lista-res" style="margin-top: 10px;"></div>
            </div>
        </div>
        <div class="bottom-col" style="width: 30%;">
            <div class="split-card" style="border: 2px solid var(--blue); background: #1e3a4a;">
                <div class="kpi-label" style="color: var(--blue);">🔥 Promedio</div>
                <div id="v-promedio" style="font-size: 3.2rem; font-weight: 900; margin: 10px 0;">0</div>
                <div style="font-size: 0.8rem; font-weight: bold;">GEST/PERS</div>
            </div>
            <div class="split-card" style="border: 2px solid var(--green); background: #1a3a2a;">
                <div class="kpi-label" style="color: var(--green);">📞 RPC %</div>
                <div id="v-rpc" style="font-size: 3.2rem; font-weight: 900; margin: 10px 0;">0%</div>
                <div style="font-size: 0.8rem; font-weight: bold;">CONTACTO</div>
            </div>
        </div>
    </div>

    <script>
        function update() {
            if (typeof datosDaimler === 'undefined') return;
            var d = datosDaimler;
            document.getElementById('w-efec').innerHTML = d.premios.efectividad;
            document.getElementById('w-trab').innerHTML = d.premios.trabajador;
            document.getElementById('w-racha').innerHTML = d.premios.racha;
            document.getElementById('v-gest').innerHTML = d.kpis.total_gestiones.toLocaleString();
            document.getElementById('v-react').innerHTML = d.kpis.total_promesas.toLocaleString();
            document.getElementById('v-rpc-main').innerHTML = d.kpis.rpc_pct + '%';
            document.getElementById('v-promedio').innerHTML = d.kpis.promedio_por_asesor;
            document.getElementById('v-rpc').innerHTML = d.kpis.rpc_pct + '%';
            
            var listaHtml = "";
            var keys = Object.keys(d.contactability);
            for(var i=0; i < Math.min(keys.length, 5); i++) {
                var key = keys[i];
                listaHtml += '<div class="res-item"><span>' + key + '</span><b style="color: var(--blue)">' + d.contactability[key] + '</b><div style="clear:both;"></div></div>';
            }
            document.getElementById('lista-res').innerHTML = listaHtml;
            
            new Chart(document.getElementById('chartCarrera'), { 
                type: 'bar', 
                data: { labels: d.carrera.nombres, datasets: [{ data: d.carrera.cantidades, backgroundColor: '#38bdf8' }] }, 
                options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#fff', font: {size: 14} } }, y: { ticks: { color: '#fff', font: {size: 14, weight: 'bold'} } } } } 
            });
            new Chart(document.getElementById('chartHora'), { 
                type: 'line', 
                data: { labels: d.grafica_hora.horas, datasets: [{ data: d.grafica_hora.conteo, borderColor: '#38bdf8', fill: false, borderWidth: 4 }] }, 
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94a3b8', font: {size: 12} } }, y: { display: false } } } 
            });
        }
        window.onload = update;
    </script>
</body>
</html>
