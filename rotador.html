<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rotador Dashboards Daimler - Gabssa</title>
    <style>
        /* Estilos para que el dashboard ocupe toda la pantalla sin bordes */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background: #0f172a; 
        }
        
        #contenedor-pantalla {
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.8s ease-in-out; /* Efecto suave de fundido al cambiar */
        }
    </style>
</head>
<body>

    <iframe id="contenedor-pantalla" src=""></iframe>

    <script>
        // Configuración de la lista de reproducción (solo dashboards)
    const paginas = [
    { url: "index_tp_ayer.html", tiempo: 40000 },   // Llama al archivo de Ayer
    { url: "index_tp_semana.html", tiempo: 25000 }, // Llama al archivo de Semana
    { url: "index_tp_mes.html", tiempo: 25000 }    // Llama al archivo de Mes
];

        let indiceActual = 0;
        const frame = document.getElementById('contenedor-pantalla');

        function cambiarPagina() {
            // 1. Iniciar desvanecimiento (opacidad 0)
            frame.style.opacity = 0;

            setTimeout(() => {
                // 2. Cambiar la URL de la página
                const infoPagina = paginas[indiceActual];
                frame.src = infoPagina.url;

                // 3. Volver a mostrar (opacidad 1)
                frame.style.opacity = 1;

                // 4. Programar el siguiente cambio basado en el tiempo definido
                setTimeout(cambiarPagina, infoPagina.tiempo);

                // 5. Mover al siguiente índice de la lista
                indiceActual = (indiceActual + 1) % paginas.length;
                
            }, 800); // Tiempo que dura el efecto de desvanecimiento
        }

        // Iniciar la rotación al cargar la página
        window.onload = cambiarPagina;
    </script>
</body>
</html>
